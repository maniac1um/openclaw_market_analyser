services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      OPENCLAW_DATABASE_URL: ${OPENCLAW_DATABASE_URL:?Set OPENCLAW_DATABASE_URL for production-like deploys}
      OPENCLAW_MONITORING_DATABASE_URL: ${OPENCLAW_MONITORING_DATABASE_URL:?Set OPENCLAW_MONITORING_DATABASE_URL}
      OPENCLAW_NEWS_DATABASE_URL: ${OPENCLAW_NEWS_DATABASE_URL:?Set OPENCLAW_NEWS_DATABASE_URL}
      OPENCLAW_STATE_DIR: /openclaw-state
      OPENCLAW_GATEWAY_STATE_DIR: ${OPENCLAW_GATEWAY_STATE_DIR:-/openclaw-state}
      OPENCLAW_GATEWAY_PORTAL_STATE_DIR: ${OPENCLAW_GATEWAY_PORTAL_STATE_DIR:-/openclaw-portal-state}
    volumes:
      - ./app:/app/app:ro   # 可选：热更新后端代码；正式发布建议 rebuild 镜像
      - ./openclaw-state:/openclaw-state:ro
      - ./openclaw-portal-state:/openclaw-portal-state:ro
      - ./frontend/dist:/app/frontend/dist:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Gateway (18789) runs on host — NOT published here. App reaches it via host.docker.internal or 127.0.0.1 bind.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  postgres:
    profiles: ["full"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openclaw
      # Dev-only default — override POSTGRES_PASSWORD in production (startup_checks rejects openclaw_dev DSNs).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # No host port mapping by default — DB reachable only on the Docker network.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclaw"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
