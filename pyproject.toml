[project]
name = "openclaw-news-publisher"
version = "0.1.0"
description = "OpenClaw news intake and publish service"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "starlette>=1.0.1",
  "idna>=3.15",
  "pydantic-settings",
  "uvicorn",
  "websockets",
  "psycopg[binary]",
  "argon2-cffi",
  "PyJWT",
  "email-validator",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "httpx",
  "pip-audit",
  "bandit>=1.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
